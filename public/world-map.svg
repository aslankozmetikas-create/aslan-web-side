<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" style="background:#000000;">
  <defs>
    <!-- Dark Luxury Atmosphere & Spotlight Gradients -->
    <radialGradient id="centerAtmosphere" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#e5a93c" stop-opacity="0.38"/>
      <stop offset="25%" stop-color="#7a5214" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#120c03" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="1"/>
    </radialGradient>

    <radialGradient id="floorSpotlight" cx="50%" cy="85%" r="35%">
      <stop offset="0%" stop-color="#ffe082" stop-opacity="0.4"/>
      <stop offset="40%" stop-color="#b47b1c" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="arcGlowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.15"/>
      <stop offset="20%" stop-color="#fef08a" stop-opacity="0.95"/>
      <stop offset="80%" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#b47b1c" stop-opacity="0.15"/>
    </linearGradient>

    <linearGradient id="arcCoreGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b47b1c" stop-opacity="0.2"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="55%" stop-color="#fff9c4" stop-opacity="1"/>
      <stop offset="100%" stop-color="#b47b1c" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Hyper Glow Filters -->
    <filter id="intenseBloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="3" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Starburst Lens Flare for Major Hubs -->
    <g id="starBurst">
      <ellipse cx="0" cy="0" rx="26" ry="1.8" fill="#ffffff" filter="url(#softGlow)"/>
      <ellipse cx="0" cy="0" rx="1.8" ry="26" fill="#ffffff" filter="url(#softGlow)"/>
      <circle cx="0" cy="0" r="3" fill="#ffffff"/>
      <circle cx="0" cy="0" r="9" fill="#ffc107" fill-opacity="0.75" filter="url(#intenseBloom)"/>
    </g>

    <!-- City Node Marker -->
    <g id="hubNode">
      <circle r="15" fill="#ffb300" fill-opacity="0.3" filter="url(#intenseBloom)"/>
      <circle r="6" fill="#ffd700" fill-opacity="0.85"/>
      <circle r="2.5" fill="#ffffff"/>
    </g>
  </defs>

  <!-- Deep Black Canvas & Central Gold Ambient Glow -->
  <rect width="1200" height="700" fill="#000000"/>
  <rect width="1200" height="700" fill="url(#centerAtmosphere)"/>
  <rect width="1200" height="700" fill="url(#floorSpotlight)"/>

  <!-- Perspective 3D Floor Radar Rings & Reflection -->
  <g transform="translate(600, 610) scale(1.15, 0.22)" stroke="#d4af37" fill="none">
    <circle r="75" stroke-width="1.6" stroke-opacity="0.65" filter="url(#softGlow)"/>
    <circle r="150" stroke-width="1.3" stroke-opacity="0.4"/>
    <circle r="240" stroke-width="1" stroke-opacity="0.25"/>
    <circle r="350" stroke-width="0.8" stroke-opacity="0.14"/>
    <circle r="480" stroke-width="0.5" stroke-opacity="0.06"/>
    <circle r="620" stroke-width="0.3" stroke-opacity="0.03"/>
  </g>

  <!-- Floor Center Spot Flare -->
  <circle cx="600" cy="610" r="12" fill="#ffe082" fill-opacity="0.6" filter="url(#intenseBloom)"/>
  <ellipse cx="600" cy="610" rx="40" ry="3" fill="#ffffff" fill-opacity="0.8" filter="url(#softGlow)"/>

  <!-- Photorealistic Detailed Gold/Dark Continents -->
  <g fill="#161007" stroke="#99701e" stroke-width="0.85" stroke-opacity="0.55" filter="url(#softGlow)">
    <!-- North America -->
    <path d="M 100 150 C 130 110, 220 90, 310 100 C 370 110, 430 130, 410 190 C 390 230, 340 250, 290 270 C 260 300, 220 320, 200 290 C 170 260, 130 250, 100 200 Z"/>
    <path d="M 350 55 C 400 45, 440 65, 410 105 C 370 125, 340 95, 350 55 Z"/> <!-- Greenland -->

    <!-- South America -->
    <path d="M 250 320 C 300 330, 330 360, 370 420 C 390 490, 350 590, 290 610 C 250 570, 230 470, 240 390 Z"/>

    <!-- Europe -->
    <path d="M 510 120 C 570 100, 640 110, 660 160 C 630 200, 570 220, 530 190 C 500 170, 490 140, 510 120 Z"/>
    <path d="M 480 120 C 505 110, 510 140, 485 150 Z"/> <!-- UK -->

    <!-- Africa -->
    <path d="M 500 210 C 640 200, 700 280, 660 400 C 620 480, 560 520, 520 460 C 490 390, 480 290, 500 210 Z"/>
    <path d="M 680 410 C 700 400, 705 440, 685 450 Z"/> <!-- Madagascar -->

    <!-- Asia & Middle East -->
    <path d="M 660 110 C 820 80, 1030 120, 1060 240 C 1010 320, 860 340, 760 280 C 700 240, 640 180, 660 110 Z"/>
    <path d="M 750 290 C 810 300, 820 360, 770 370 Z"/> <!-- India -->
    <path d="M 990 180 C 1030 170, 1030 240, 980 250 Z"/> <!-- Japan -->

    <!-- Australia & NZ -->
    <path d="M 880 420 C 980 410, 1020 470, 980 540 C 920 560, 870 530, 870 470 Z"/>
    <path d="M 1030 530 C 1050 520, 1055 560, 1035 570 Z"/>
  </g>

  <!-- Dense Golden & White Glowing City Lights Matrix -->
  <g fill="#ffe082">
    <!-- North America (East Coast, Midwest, West Coast, Texas) -->
    <circle cx="270" cy="170" r="2.2" fill="#ffffff" filter="url(#softGlow)"/>
    <circle cx="285" cy="160" r="1.8"/><circle cx="300" cy="175" r="2.4" fill="#ffffff" filter="url(#softGlow)"/>
    <circle cx="260" cy="185" r="1.6"/><circle cx="240" cy="165" r="1.6"/><circle cx="310" cy="190" r="2"/>
    <circle cx="280" cy="200" r="1.8"/><circle cx="295" cy="210" r="2.2" fill="#ffffff"/>
    <circle cx="170" cy="200" r="2.8" fill="#ffffff" filter="url(#softGlow)"/> <!-- LA -->
    <circle cx="160" cy="185" r="2" fill="#ffffff"/><circle cx="180" cy="220" r="1.6"/>
    <circle cx="220" cy="260" r="2"/>

    <!-- South America (Brazil, Argentina, Coast) -->
    <circle cx="320" cy="440" r="2.6" fill="#ffffff" filter="url(#softGlow)"/>
    <circle cx="335" cy="455" r="2"/><circle cx="290" cy="510" r="2"/>
    <circle cx="270" cy="350" r="1.8"/>

    <!-- Western & Central Europe -->
    <circle cx="500" cy="135" r="2.8" fill="#ffffff" filter="url(#softGlow)"/> <!-- London -->
    <circle cx="520" cy="150" r="3.2" fill="#ffffff" filter="url(#softGlow)"/> <!-- Paris -->
    <circle cx="545" cy="160" r="3.8" fill="#ffffff" filter="url(#intenseBloom)"/> <!-- Milan / Alps Hub -->
    <circle cx="560" cy="140" r="2.2"/><circle cx="530" cy="130" r="2"/>
    <circle cx="505" cy="170" r="2"/> <!-- Madrid -->
    <circle cx="535" cy="175" r="2.2"/>

    <!-- Middle East & Gulf (Dubai, Riyadh, Istanbul, Cairo) -->
    <circle cx="600" cy="190" r="2.8" fill="#ffffff" filter="url(#softGlow)"/> <!-- Istanbul -->
    <circle cx="590" cy="225" r="2.5" fill="#ffffff"/> <!-- Cairo -->
    <circle cx="660" cy="245" r="4.2" fill="#ffffff" filter="url(#intenseBloom)"/> <!-- Dubai / UAE -->
    <circle cx="635" cy="265" r="2.8" fill="#ffffff"/>

    <!-- Africa -->
    <circle cx="530" cy="310" r="2"/><circle cx="620" cy="330" r="2"/><circle cx="580" cy="460" r="2.2"/>

    <!-- Asia (India, China, Japan, SE Asia) -->
    <circle cx="740" cy="265" r="2.5"/><circle cx="750" cy="240" r="2.8" fill="#ffffff"/>
    <circle cx="890" cy="180" r="2.5"/><circle cx="920" cy="215" r="3.2" fill="#ffffff" filter="url(#softGlow)"/> <!-- Shanghai -->
    <circle cx="900" cy="250" r="2.5"/>
    <circle cx="990" cy="200" r="3.8" fill="#ffffff" filter="url(#intenseBloom)"/> <!-- Tokyo -->
    <circle cx="960" cy="185" r="2.5"/> <!-- Seoul -->
    <circle cx="850" cy="330" r="3.2" fill="#ffffff" filter="url(#softGlow)"/> <!-- Singapore -->

    <!-- Australia -->
    <circle cx="970" cy="505" r="3" fill="#ffffff" filter="url(#softGlow)"/> <!-- Sydney -->
    <circle cx="945" cy="525" r="2"/><circle cx="880" cy="490" r="1.8"/>
  </g>

  <!-- 3D Luminous Curved Golden Distribution Arcs -->
  <g stroke="url(#arcGlowGrad)" fill="none" filter="url(#intenseBloom)">
    <!-- Milan (545, 160) -> NYC (300, 175) -->
    <path d="M 545 160 C 460 90, 370 100, 300 175" stroke-width="3.2"/>

    <!-- Milan (545, 160) -> LA (170, 200) -->
    <path d="M 545 160 C 410 60, 270 80, 170 200" stroke-width="2.4" stroke-dasharray="9 4"/>

    <!-- Milan (545, 160) -> Dubai (660, 245) -->
    <path d="M 545 160 C 590 180, 620 200, 660 245" stroke-width="3.8"/>

    <!-- Dubai (660, 245) -> Shanghai (920, 215) -->
    <path d="M 660 245 C 770 140, 860 150, 920 215" stroke-width="3.2"/>

    <!-- Dubai (660, 245) -> Tokyo (990, 200) -->
    <path d="M 660 245 C 800 110, 920 120, 990 200" stroke-width="3"/>

    <!-- Dubai (660, 245) -> Singapore (850, 330) -->
    <path d="M 660 245 C 740 290, 790 310, 850 330" stroke-width="2.6"/>

    <!-- Singapore (850, 330) -> Sydney (970, 505) -->
    <path d="M 850 330 C 920 400, 940 440, 970 505" stroke-width="2.6"/>

    <!-- Milan (545, 160) -> Sao Paulo (320, 440) -->
    <path d="M 545 160 C 440 280, 370 360, 320 440" stroke-width="2.6"/>

    <!-- NYC (300, 175) -> Sao Paulo (320, 440) -->
    <path d="M 300 175 C 320 280, 330 360, 320 440" stroke-width="2.2" stroke-dasharray="7 4"/>
  </g>

  <!-- Sharp Core Highlight Line over Golden Arcs -->
  <g stroke="url(#arcCoreGrad)" fill="none" stroke-width="1.4">
    <path d="M 545 160 C 460 90, 370 100, 300 175"/>
    <path d="M 545 160 C 590 180, 620 200, 660 245"/>
    <path d="M 660 245 C 770 140, 860 150, 920 215"/>
    <path d="M 660 245 C 800 110, 920 120, 990 200"/>
    <path d="M 660 245 C 740 290, 790 310, 850 330"/>
    <path d="M 850 330 C 920 400, 940 440, 970 505"/>
    <path d="M 545 160 C 440 280, 370 360, 320 440"/>
  </g>

  <!-- Key Major Global Hub Nodes & Star Burst Lens Flares -->
  <g transform="translate(545, 160)">
    <use href="#hubNode"/>
    <use href="#starBurst"/>
  </g>
  <g transform="translate(660, 245)">
    <use href="#hubNode"/>
    <use href="#starBurst"/>
  </g>
  <g transform="translate(300, 175)">
    <use href="#hubNode"/>
    <use href="#starBurst"/>
  </g>
  <g transform="translate(990, 200)">
    <use href="#hubNode"/>
    <use href="#starBurst"/>
  </g>
  <g transform="translate(850, 330)">
    <use href="#hubNode"/>
  </g>
  <g transform="translate(970, 505)">
    <use href="#hubNode"/>
  </g>
  <g transform="translate(320, 440)">
    <use href="#hubNode"/>
  </g>

  <!-- Subtle Vignette Border Frame -->
  <rect width="1200" height="700" fill="none" stroke="#d4af37" stroke-width="1.5" stroke-opacity="0.3" rx="14"/>
</svg>
